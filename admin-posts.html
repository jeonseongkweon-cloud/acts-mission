<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACTS 게시판 관리</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }

    header {
      background: #061A33;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      margin-top: 5px;
      color: #d6ae55;
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-gold {
      background: #d6ae55;
      color: #061A33;
    }

    .btn-gray {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-red {
      background: #b91c1c;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px 50px;
    }

    .top-panel,
    .editor,
    .list-panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .top-panel {
      padding: 24px;
      margin-bottom: 25px;
    }

    .top-panel h2 {
      color: #061A33;
      margin-bottom: 8px;
    }

    .top-panel p {
      color: #6b7280;
      line-height: 1.6;
    }

    .category-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .category-btn {
      border: 1px solid #d1d5db;
      background: white;
      color: #374151;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .category-btn.active {
      background: #061A33;
      color: white;
      border-color: #061A33;
    }

    .editor {
      padding: 25px;
      margin-bottom: 30px;
    }

    .editor h3 {
      color: #061A33;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #374151;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      padding: 11px 12px;
      background: white;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.6;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .image-upload-box {
      border: 1px dashed #cbd5e1;
      background: #f8fafc;
      border-radius: 10px;
      padding: 16px;
    }

    .image-help {
      margin-top: 8px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }

    .image-preview-wrap {
      display: none;
      margin-top: 14px;
    }

    .image-preview-wrap.show {
      display: block;
    }

    .image-preview {
      display: block;
      width: 100%;
      max-width: 520px;
      max-height: 320px;
      object-fit: contain;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }

    .image-preview-actions {
      margin-top: 10px;
    }

    .editor-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }

    .list-panel {
      padding: 25px;
    }

    .list-panel h3 {
      color: #061A33;
      margin-bottom: 20px;
    }

    .post-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 13px;
    }

    .post-title {
      font-size: 17px;
      font-weight: bold;
      color: #061A33;
      margin-bottom: 8px;
    }

    .post-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .post-thumb {
      display: block;
      width: 180px;
      max-width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 6px;
    }

    .published {
      background: #dcfce7;
      color: #166534;
    }

    .private {
      background: #fee2e2;
      color: #991b1b;
    }

    .post-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .post-actions button {
      padding: 7px 11px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 35px 10px;
    }

    @media (max-width: 700px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      header {
        padding: 18px;
      }

      .container {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>ACTS BOARD ADMIN</h1>
    <p>ACTS MISSION ALLIANCE 게시판 관리 시스템</p>
  </div>

  <div class="header-actions">
    <button class="btn btn-gold" id="dashboardBtn">
      관리자 홈
    </button>

    <button class="btn btn-gray" id="logoutBtn">
      로그아웃
    </button>
  </div>
</header>


<main class="container">

  <section class="top-panel">

    <h2 id="boardTitle">
      ACTS 게시판 관리
    </h2>

    <p>
      게시글을 등록·수정·삭제하고 공개 여부와 대표 이미지를 관리할 수 있습니다.
    </p>

    <div class="category-bar">

      <button class="category-btn" data-category="prayer">
        🙏 기도나눔 · Prayer
      </button>

      <button class="category-btn" data-category="news">
        📰 ACTS 소식 · News
      </button>

      <button class="category-btn" data-category="training">
        🎓 교육·세미나 · Training
      </button>

      <button class="category-btn" data-category="mission">
        🌍 선교활동 · Mission
      </button>

      <button class="category-btn" data-category="community">
        🤝 회원소통 · Community
      </button>

    </div>

  </section>


  <section class="editor">

    <h3 id="editorTitle">
      새 게시글 작성
    </h3>

    <input type="hidden" id="postId">
    <input type="hidden" id="currentImageUrl">


    <div class="form-group">

      <label for="title">
        제목
      </label>

      <input
        type="text"
        id="title"
        placeholder="게시글 제목을 입력하세요"
      >

    </div>


    <div class="form-group">

      <label for="content">
        본문
      </label>

      <textarea
        id="content"
        placeholder="게시글 내용을 입력하세요"
      ></textarea>

    </div>


    <div class="form-group">

      <label for="imageFile">
        대표 이미지
      </label>

      <div class="image-upload-box">

        <input
          type="file"
          id="imageFile"
          accept="image/*"
        >

        <div class="image-help">
          JPG, PNG, WEBP 등의 이미지를 선택할 수 있습니다.
          최대 10MB까지 업로드할 수 있습니다.
          사진이 필요 없는 글은 이미지를 선택하지 않아도 됩니다.
        </div>

        <div
          class="image-preview-wrap"
          id="imagePreviewWrap"
        >

          <img
            class="image-preview"
            id="imagePreview"
            alt="대표 이미지 미리보기"
          >

          <div class="image-preview-actions">

            <button
              type="button"
              class="btn btn-red"
              id="removeImageBtn"
            >
              이미지 제거
            </button>

          </div>

        </div>

      </div>

    </div>


    <div class="form-row">

      <div class="form-group">

        <label for="author">
          작성자
        </label>

        <input
          type="text"
          id="author"
          value="ACTS MISSION ALLIANCE"
        >

      </div>


      <div class="form-group">

        <label for="published">
          공개 상태
        </label>

        <select id="published">

          <option value="true">
            공개
          </option>

          <option value="false">
            비공개
          </option>

        </select>

      </div>

    </div>


    <div class="editor-actions">

      <button
        class="btn btn-gold"
        id="saveBtn"
      >
        게시글 저장
      </button>

      <button
        class="btn btn-gray"
        id="cancelEditBtn"
        style="display:none;"
      >
        수정 취소
      </button>

    </div>

    <div
      id="statusMessage"
      class="status"
    ></div>

  </section>


  <section class="list-panel">

    <h3>
      등록된 게시글
    </h3>

    <div id="postsList">

      <div class="empty">
        게시글을 불러오는 중입니다...
      </div>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    'https://ojxarsfaewehwjidwgac.supabase.co';

  const SUPABASE_ANON_KEY =
    'sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0';

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  const STORAGE_BUCKET =
    'post-images';

  const MAX_IMAGE_SIZE =
    10 * 1024 * 1024;


  const boardNames = {

    prayer:
      '기도나눔 · ACTS Prayer',

    news:
      'ACTS 소식 · ACTS News',

    training:
      '교육·세미나 · ACTS Training',

    mission:
      '선교활동 · ACTS Mission',

    community:
      '회원소통 · ACTS Community'

  };


  const allowedCategories =
    Object.keys(
      boardNames
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  let currentCategory =
    params.get('category')
    || 'news';


  let removeCurrentImage =
    false;


  if (
    !allowedCategories.includes(
      currentCategory
    )
  ) {

    currentCategory =
      'news';
  }


  async function checkAdminLogin() {

    try {

      const {
        data: { session },
        error
      } =
        await supabaseClient
          .auth
          .getSession();


      if (
        error
        ||
        !session
      ) {

        window.location.replace(
          'admin.html'
        );

        return false;
      }


      return true;

    }

    catch (error) {

      console.error(
        error
      );

      window.location.replace(
        'admin.html'
      );

      return false;
    }
  }


  function updateBoardUI() {

    document
      .getElementById(
        'boardTitle'
      )
      .textContent =
        boardNames[
          currentCategory
        ]
        +
        ' 관리';


    document
      .querySelectorAll(
        '.category-btn'
      )
      .forEach(
        button => {

          button
            .classList
            .toggle(
              'active',
              button.dataset.category
              ===
              currentCategory
            );
        }
      );


    const url =
      new URL(
        window.location.href
      );


    url.searchParams.set(
      'category',
      currentCategory
    );


    window.history.replaceState(
      {},
      '',
      url
    );
  }


  function showStatus(
    message,
    type = 'success'
  ) {

    const status =
      document.getElementById(
        'statusMessage'
      );


    status.textContent =
      message;


    status.className =
      'status '
      +
      type;
  }


  function clearStatus() {

    const status =
      document.getElementById(
        'statusMessage'
      );


    status.textContent =
      '';


    status.className =
      'status';
  }


  function showImagePreview(
    src
  ) {

    const wrap =
      document.getElementById(
        'imagePreviewWrap'
      );


    const preview =
      document.getElementById(
        'imagePreview'
      );


    if (!src) {

      preview.removeAttribute(
        'src'
      );

      wrap.classList.remove(
        'show'
      );

      return;
    }


    preview.src =
      src;


    wrap.classList.add(
      'show'
    );
  }


  function validateImageFile(
    file
  ) {

    if (!file) {

      return true;
    }


    if (
      !file.type
      ||
      !file.type.startsWith(
        'image/'
      )
    ) {

      showStatus(
        '이미지 파일만 업로드할 수 있습니다.',
        'error'
      );

      return false;
    }


    if (
      file.size
      >
      MAX_IMAGE_SIZE
    ) {

      showStatus(
        '이미지는 10MB 이하만 업로드할 수 있습니다.',
        'error'
      );

      return false;
    }


    return true;
  }


  async function uploadPostImage(
    file
  ) {

    const extension =
      (
        file.name
          .split('.')
          .pop()
        ||
        'jpg'
      )
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ''
      )
      ||
      'jpg';


    const randomName =
      Math.random()
        .toString(36)
        .slice(2, 10);


    const filePath =
      currentCategory
      +
      '/'
      +
      Date.now()
      +
      '-'
      +
      randomName
      +
      '.'
      +
      extension;


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .upload(
          filePath,
          file,
          {
            cacheControl:
              '3600',

            upsert:
              false,

            contentType:
              file.type
          }
        );


    if (error) {

      throw error;
    }


    const {
      data
    } =
      supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .getPublicUrl(
          filePath
        );


    return {
      path:
        filePath,

      url:
        data.publicUrl
    };
  }


  function getStoragePathFromUrl(
    url
  ) {

    if (!url) {

      return '';
    }


    const marker =
      '/storage/v1/object/public/'
      +
      STORAGE_BUCKET
      +
      '/';


    const index =
      url.indexOf(
        marker
      );


    if (
      index === -1
    ) {

      return '';
    }


    return decodeURIComponent(
      url.substring(
        index
        +
        marker.length
      )
    );
  }


  async function removeStorageImageByUrl(
    url
  ) {

    const path =
      getStoragePathFromUrl(
        url
      );


    if (!path) {

      return;
    }


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .remove([
          path
        ]);


    if (error) {

      console.warn(
        '이미지 삭제 실패:',
        error
      );
    }
  }


  function resetEditor() {

    document
      .getElementById(
        'postId'
      )
      .value =
        '';


    document
      .getElementById(
        'title'
      )
      .value =
        '';


    document
      .getElementById(
        'content'
      )
      .value =
        '';


    document
      .getElementById(
        'author'
      )
      .value =
        'ACTS MISSION ALLIANCE';


    document
      .getElementById(
        'published'
      )
      .value =
        'true';


    document
      .getElementById(
        'imageFile'
      )
      .value =
        '';


    document
      .getElementById(
        'currentImageUrl'
      )
      .value =
        '';


    removeCurrentImage =
      false;


    showImagePreview(
      ''
    );


    document
      .getElementById(
        'editorTitle'
      )
      .textContent =
        '새 게시글 작성';


    document
      .getElementById(
        'saveBtn'
      )
      .textContent =
        '게시글 저장';


    document
      .getElementById(
        'cancelEditBtn'
      )
      .style.display =
        'none';


    clearStatus();
  }


  function escapeHtml(
    value
  ) {

    return String(
      value || ''
    )

      .replaceAll(
        '&',
        '&amp;'
      )

      .replaceAll(
        '<',
        '&lt;'
      )

      .replaceAll(
        '>',
        '&gt;'
      )

      .replaceAll(
        '"',
        '&quot;'
      )

      .replaceAll(
        "'",
        '&#039;'
      );
  }


  async function loadPosts() {

    const postsList =
      document.getElementById(
        'postsList'
      );


    postsList.innerHTML =
      '<div class="empty">'
      +
      '게시글을 불러오는 중입니다...'
      +
      '</div>';


    const {
      data,
      error
    } =
      await supabaseClient

        .from(
          'posts'
        )

        .select(
          '*'
        )

        .eq(
          'category',
          currentCategory
        )

        .order(
          'created_at',
          {
            ascending:
              false
          }
        );


    if (error) {

      console.error(
        error
      );


      postsList.innerHTML =
        '<div class="empty">'
        +
        '게시글을 불러오지 못했습니다.'
        +
        '</div>';


      return;
    }


    if (
      !data
      ||
      data.length === 0
    ) {

      postsList.innerHTML =
        '<div class="empty">'
        +
        '등록된 게시글이 없습니다.'
        +
        '</div>';


      return;
    }


    postsList.innerHTML =
      '';


    data.forEach(
      post => {

        const item =
          document.createElement(
            'div'
          );


        item.className =
          'post-item';


        const title =
          document.createElement(
            'div'
          );


        title.className =
          'post-title';


        title.textContent =
          post.title
          ||
          '(제목 없음)';


        const meta =
          document.createElement(
            'div'
          );


        meta.className =
          'post-meta';


        const date =
          post.created_at

            ? new Date(
                post.created_at
              )
              .toLocaleString(
                'ko-KR'
              )

            : '';


        const badge =
          post.is_published

            ? '<span class="badge published">공개</span>'

            : '<span class="badge private">비공개</span>';


        meta.innerHTML =
          '작성자: '
          +
          escapeHtml(
            post.author
            ||
            'ACTS MISSION ALLIANCE'
          )
          +
          ' · '
          +
          date
          +
          badge;


        item.appendChild(
          title
        );


        item.appendChild(
          meta
        );


        if (
          post.image_url
        ) {

          const image =
            document.createElement(
              'img'
            );


          image.className =
            'post-thumb';


          image.src =
            post.image_url;


          image.alt =
            post.title
            ||
            '게시글 이미지';


          item.appendChild(
            image
          );
        }


        const actions =
          document.createElement(
            'div'
          );


        actions.className =
          'post-actions';


        const editButton =
          document.createElement(
            'button'
          );


        editButton.className =
          'btn-gold';


        editButton.textContent =
          '수정';


        editButton.addEventListener(
          'click',
          () => {

            editPost(
              post
            );
          }
        );


        const deleteButton =
          document.createElement(
            'button'
          );


        deleteButton.className =
          'btn-red';


        deleteButton.textContent =
          '삭제';


        deleteButton.addEventListener(
          'click',
          () => {

            deletePost(
              post
            );
          }
        );


        actions.appendChild(
          editButton
        );


        actions.appendChild(
          deleteButton
        );


        item.appendChild(
          actions
        );


        postsList.appendChild(
          item
        );
      }
    );
  }


  async function savePost() {

    clearStatus();


    const id =
      document
        .getElementById(
          'postId'
        )
        .value;


    const title =
      document
        .getElementById(
          'title'
        )
        .value
        .trim();


    const content =
      document
        .getElementById(
          'content'
        )
        .value
        .trim();


    const author =
      document
        .getElementById(
          'author'
        )
        .value
        .trim()
      ||
      'ACTS MISSION ALLIANCE';


    const isPublished =
      document
        .getElementById(
          'published'
        )
        .value
      ===
      'true';


    const imageFile =
      document
        .getElementById(
          'imageFile'
        )
        .files[0]
      ||
      null;


    const oldImageUrl =
      document
        .getElementById(
          'currentImageUrl'
        )
        .value
      ||
      '';


    if (!title) {

      showStatus(
        '제목을 입력해주세요.',
        'error'
      );

      return;
    }


    if (!content) {

      showStatus(
        '본문을 입력해주세요.',
        'error'
      );

      return;
    }


    if (
      !validateImageFile(
        imageFile
      )
    ) {

      return;
    }


    const saveBtn =
      document.getElementById(
        'saveBtn'
      );


    saveBtn.disabled =
      true;


    saveBtn.textContent =
      imageFile
        ? '이미지 업로드 중...'
        : '게시글 저장 중...';


    let uploadedImage =
      null;


    try {

      let nextImageUrl =
        oldImageUrl;


      if (
        imageFile
      ) {

        uploadedImage =
          await uploadPostImage(
            imageFile
          );


        nextImageUrl =
          uploadedImage.url;
      }


      else if (
        removeCurrentImage
      ) {

        nextImageUrl =
          '';
      }


      const payload = {

        category:
          currentCategory,

        title:
          title,

        content:
          content,

        author:
          author,

        is_published:
          isPublished,

        image_url:
          nextImageUrl
          ||
          null,

        updated_at:
          new Date()
            .toISOString()

      };


      let result;


      if (id) {

        result =
          await supabaseClient

            .from(
              'posts'
            )

            .update(
              payload
            )

            .eq(
              'id',
              id
            );
      }


      else {

        result =
          await supabaseClient

            .from(
              'posts'
            )

            .insert(
              payload
            );
      }


      if (
        result.error
      ) {

        if (
          uploadedImage
        ) {

          await removeStorageImageByUrl(
            uploadedImage.url
          );
        }


        throw result.error;
      }


      if (
        id
        &&
        oldImageUrl
        &&
        (
          removeCurrentImage
          ||
          (
            uploadedImage
            &&
            uploadedImage.url
            !==
            oldImageUrl
          )
        )
      ) {

        await removeStorageImageByUrl(
          oldImageUrl
        );
      }


      resetEditor();


      await loadPosts();


      showStatus(
        id
          ? '게시글이 수정되었습니다.'
          : '게시글이 등록되었습니다.',
        'success'
      );

    }


    catch (error) {

      console.error(
        error
      );


      showStatus(
        '저장하지 못했습니다: '
        +
        (
          error.message
          ||
          '알 수 없는 오류'
        ),
        'error'
      );

    }


    finally {

      saveBtn.disabled =
        false;


      saveBtn.textContent =
        document
          .getElementById(
            'postId'
          )
          .value

          ? '수정 내용 저장'

          : '게시글 저장';
    }
  }


  function editPost(
    post
  ) {

    document
      .getElementById(
        'postId'
      )
      .value =
        post.id;


    document
      .getElementById(
        'title'
      )
      .value =
        post.title
        ||
        '';


    document
      .getElementById(
        'content'
      )
      .value =
        post.content
        ||
        '';


    document
      .getElementById(
        'author'
      )
      .value =
        post.author
        ||
        'ACTS MISSION ALLIANCE';


    document
      .getElementById(
        'published'
      )
      .value =
        post.is_published
          ? 'true'
          : 'false';


    document
      .getElementById(
        'imageFile'
      )
      .value =
        '';


    document
      .getElementById(
        'currentImageUrl'
      )
      .value =
        post.image_url
        ||
        '';


    removeCurrentImage =
      false;


    showImagePreview(
      post.image_url
      ||
      ''
    );


    document
      .getElementById(
        'editorTitle'
      )
      .textContent =
        '게시글 수정';


    document
      .getElementById(
        'saveBtn'
      )
      .textContent =
        '수정 내용 저장';


    document
      .getElementById(
        'cancelEditBtn'
      )
      .style.display =
        'inline-block';


    window.scrollTo({
      top:
        0,

      behavior:
        'smooth'
    });
  }


  async function deletePost(
    post
  ) {

    const confirmed =
      confirm(
        '이 게시글을 정말 삭제하시겠습니까?'
      );


    if (!confirmed) {

      return;
    }


    const {
      error
    } =
      await supabaseClient

        .from(
          'posts'
        )

        .delete()

        .eq(
          'id',
          post.id
        );


    if (error) {

      console.error(
        error
      );


      alert(
        '게시글을 삭제하지 못했습니다.\n'
        +
        error.message
      );


      return;
    }


    if (
      post.image_url
    ) {

      await removeStorageImageByUrl(
        post.image_url
      );
    }


    resetEditor();


    await loadPosts();
  }


  async function logout() {

    await supabaseClient
      .auth
      .signOut();


    window.location.replace(
      'admin.html'
    );
  }


  document.addEventListener(
    'DOMContentLoaded',
    async () => {

      const loggedIn =
        await checkAdminLogin();


      if (!loggedIn) {

        return;
      }


      updateBoardUI();


      await loadPosts();


      document
        .getElementById(
          'saveBtn'
        )
        .addEventListener(
          'click',
          savePost
        );


      document
        .getElementById(
          'cancelEditBtn'
        )
        .addEventListener(
          'click',
          resetEditor
        );


      document
        .getElementById(
          'logoutBtn'
        )
        .addEventListener(
          'click',
          logout
        );


      document
        .getElementById(
          'dashboardBtn'
        )
        .addEventListener(
          'click',
          () => {

            window.location.href =
              'admin-dashboard.html';
          }
        );


      document
        .getElementById(
          'imageFile'
        )
        .addEventListener(
          'change',
          event => {

            const file =
              event.target
                .files[0]
              ||
              null;


            if (!file) {

              return;
            }


            if (
              !validateImageFile(
                file
              )
            ) {

              event.target.value =
                '';

              return;
            }


            removeCurrentImage =
              false;


            const previewUrl =
              URL.createObjectURL(
                file
              );


            showImagePreview(
              previewUrl
            );
          }
        );


      document
        .getElementById(
          'removeImageBtn'
        )
        .addEventListener(
          'click',
          () => {

            document
              .getElementById(
                'imageFile'
              )
              .value =
                '';


            removeCurrentImage =
              true;


            showImagePreview(
              ''
            );
          }
        );


      document
        .querySelectorAll(
          '.category-btn'
        )
        .forEach(
          button => {

            button.addEventListener(
              'click',
              async () => {

                currentCategory =
                  button.dataset
                    .category;


                updateBoardUI();


                resetEditor();


                await loadPosts();
              }
            );
          }
        );

    }
  );
</script>

</body>
</html>
