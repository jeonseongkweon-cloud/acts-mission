<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACTS 게시판 관리</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }

    header {
      background: #061A33;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      margin-top: 5px;
      color: #d6ae55;
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-gold {
      background: #d6ae55;
      color: #061A33;
    }

    .btn-navy {
      background: #061A33;
      color: white;
    }

    .btn-gray {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-red {
      background: #b91c1c;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px 50px;
    }

    .top-panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }

    .top-panel h2 {
      color: #061A33;
      margin-bottom: 8px;
    }

    .top-panel p {
      color: #6b7280;
      line-height: 1.6;
    }

    .category-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .category-btn {
      border: 1px solid #d1d5db;
      background: white;
      color: #374151;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .category-btn.active {
      background: #061A33;
      color: white;
      border-color: #061A33;
    }

    .editor {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      margin-bottom: 30px;
    }

    .editor h3 {
      color: #061A33;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #374151;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      padding: 11px 12px;
      background: white;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.6;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .editor-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .list-panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .list-panel h3 {
      color: #061A33;
      margin-bottom: 20px;
    }

    .post-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 13px;
    }

    .post-item:last-child {
      margin-bottom: 0;
    }

    .post-title {
      font-size: 17px;
      font-weight: bold;
      color: #061A33;
      margin-bottom: 8px;
    }

    .post-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 6px;
    }

    .published {
      background: #dcfce7;
      color: #166534;
    }

    .private {
      background: #fee2e2;
      color: #991b1b;
    }

    .post-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .post-actions button {
      padding: 7px 11px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 35px 10px;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }

    @media (max-width: 700px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      header {
        padding: 18px;
      }

      .container {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>ACTS BOARD ADMIN</h1>
    <p>ACTS MISSION ALLIANCE 게시판 관리 시스템</p>
  </div>

  <div class="header-actions">
    <button class="btn btn-gold" id="dashboardBtn">
      관리자 홈
    </button>

    <button class="btn btn-gray" id="logoutBtn">
      로그아웃
    </button>
  </div>
</header>

<main class="container">

  <section class="top-panel">
    <h2 id="boardTitle">ACTS 게시판 관리</h2>

    <p>
      게시글을 등록·수정·삭제하고 공개 여부를 관리할 수 있습니다.
    </p>

    <div class="category-bar">
      <button
        class="category-btn"
        data-category="prayer"
      >
        🙏 기도나눔 · Prayer
      </button>

      <button
        class="category-btn"
        data-category="news"
      >
        📰 ACTS 소식 · News
      </button>

      <button
        class="category-btn"
        data-category="training"
      >
        🎓 교육·세미나 · Training
      </button>

      <button
        class="category-btn"
        data-category="mission"
      >
        🌍 선교활동 · Mission
      </button>

      <button
        class="category-btn"
        data-category="community"
      >
        🤝 회원소통 · Community
      </button>
    </div>
  </section>

  <section class="editor">
    <h3 id="editorTitle">
      새 게시글 작성
    </h3>

    <input
      type="hidden"
      id="postId"
    >

    <div class="form-group">
      <label for="title">
        제목
      </label>

      <input
        type="text"
        id="title"
        placeholder="게시글 제목을 입력하세요"
      >
    </div>

    <div class="form-group">
      <label for="content">
        본문
      </label>

      <textarea
        id="content"
        placeholder="게시글 내용을 입력하세요"
      ></textarea>
    </div>

    <div class="form-row">

      <div class="form-group">
        <label for="author">
          작성자
        </label>

        <input
          type="text"
          id="author"
          value="ACTS MISSION ALLIANCE"
        >
      </div>

      <div class="form-group">
        <label for="published">
          공개 상태
        </label>

        <select id="published">
          <option value="true">
            공개
          </option>

          <option value="false">
            비공개
          </option>
        </select>
      </div>

    </div>

    <div class="editor-actions">

      <button
        class="btn btn-gold"
        id="saveBtn"
      >
        게시글 저장
      </button>

      <button
        class="btn btn-gray"
        id="cancelEditBtn"
        style="display:none;"
      >
        수정 취소
      </button>

    </div>

    <div
      id="statusMessage"
      class="status"
    ></div>

  </section>

  <section class="list-panel">

    <h3>
      등록된 게시글
    </h3>

    <div id="postsList">
      <div class="empty">
        게시글을 불러오는 중입니다...
      </div>
    </div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    'https://ojxarsfaewehwjidwgac.supabase.co';

  const SUPABASE_ANON_KEY =
    'sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0';

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /*
   * 게시판 이름
   *
   * 데이터베이스에서 사용하는
   * prayer / news / training / mission / community
   * 값은 그대로 유지합니다.
   *
   * 화면에 보이는 이름만
   * 한글 중심으로 표시합니다.
   */

  const boardNames = {

    prayer:
      '기도나눔 · ACTS Prayer',

    news:
      'ACTS 소식 · ACTS News',

    training:
      '교육·세미나 · ACTS Training',

    mission:
      '선교활동 · ACTS Mission',

    community:
      '회원소통 · ACTS Community'

  };


  const allowedCategories =
    Object.keys(boardNames);


  const params =
    new URLSearchParams(
      window.location.search
    );


  let currentCategory =
    params.get('category') || 'news';


  if (
    !allowedCategories.includes(
      currentCategory
    )
  ) {
    currentCategory = 'news';
  }


  /*
   * 관리자 로그인 확인
   */

  async function checkAdminLogin() {

    const {
      data: { session },
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if (error || !session) {

      window.location.replace(
        'admin.html'
      );

      return false;
    }


    return true;
  }


  /*
   * 현재 선택된 게시판 표시
   */

  function updateBoardUI() {

    document
      .getElementById('boardTitle')
      .textContent =
        boardNames[currentCategory]
        + ' 관리';


    document
      .querySelectorAll(
        '.category-btn'
      )
      .forEach(button => {

        button.classList.toggle(
          'active',
          button.dataset.category
            === currentCategory
        );

      });


    const url =
      new URL(
        window.location.href
      );


    url.searchParams.set(
      'category',
      currentCategory
    );


    window.history.replaceState(
      {},
      '',
      url
    );
  }


  /*
   * 상태 메시지
   */

  function showStatus(
    message,
    type = 'success'
  ) {

    const status =
      document.getElementById(
        'statusMessage'
      );


    status.textContent =
      message;


    status.className =
      'status ' + type;
  }


  function clearStatus() {

    const status =
      document.getElementById(
        'statusMessage'
      );


    status.textContent = '';

    status.className =
      'status';
  }


  /*
   * 글쓰기 입력창 초기화
   */

  function resetEditor() {

    document
      .getElementById('postId')
      .value = '';


    document
      .getElementById('title')
      .value = '';


    document
      .getElementById('content')
      .value = '';


    document
      .getElementById('author')
      .value =
        'ACTS MISSION ALLIANCE';


    document
      .getElementById('published')
      .value = 'true';


    document
      .getElementById('editorTitle')
      .textContent =
        '새 게시글 작성';


    document
      .getElementById('saveBtn')
      .textContent =
        '게시글 저장';


    document
      .getElementById(
        'cancelEditBtn'
      )
      .style.display =
        'none';


    clearStatus();
  }


  /*
   * 게시글 목록 불러오기
   */

  async function loadPosts() {

    const postsList =
      document.getElementById(
        'postsList'
      );


    postsList.innerHTML =
      '<div class="empty">'
      + '게시글을 불러오는 중입니다...'
      + '</div>';


    const {
      data,
      error
    } =
      await supabaseClient

        .from('posts')

        .select('*')

        .eq(
          'category',
          currentCategory
        )

        .order(
          'created_at',
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);


      postsList.innerHTML =
        '<div class="empty">'
        + '게시글을 불러오지 못했습니다.'
        + '</div>';


      return;
    }


    if (
      !data ||
      data.length === 0
    ) {

      postsList.innerHTML =
        '<div class="empty">'
        + '등록된 게시글이 없습니다.'
        + '</div>';


      return;
    }


    postsList.innerHTML = '';


    data.forEach(post => {

      const item =
        document.createElement(
          'div'
        );


      item.className =
        'post-item';


      const date =
        post.created_at

          ? new Date(
              post.created_at
            ).toLocaleString(
              'ko-KR'
            )

          : '';


      const statusBadge =
        post.is_published

          ? '<span class="badge published">'
            + '공개'
            + '</span>'

          : '<span class="badge private">'
            + '비공개'
            + '</span>';


      const title =
        document.createElement(
          'div'
        );


      title.className =
        'post-title';


      title.textContent =
        post.title ||
        '(제목 없음)';


      const meta =
        document.createElement(
          'div'
        );


      meta.className =
        'post-meta';


      meta.innerHTML =
        '작성자: '
        +
        escapeHtml(
          post.author ||
          '관리자'
        )
        +
        ' · '
        +
        date
        +
        statusBadge;


      const actions =
        document.createElement(
          'div'
        );


      actions.className =
        'post-actions';


      const editBtn =
        document.createElement(
          'button'
        );


      editBtn.className =
        'btn-gold';


      editBtn.textContent =
        '수정';


      editBtn.addEventListener(
        'click',
        () => editPost(post)
      );


      const deleteBtn =
        document.createElement(
          'button'
        );


      deleteBtn.className =
        'btn-red';


      deleteBtn.textContent =
        '삭제';


      deleteBtn.addEventListener(
        'click',
        () => deletePost(
          post.id
        )
      );


      actions.appendChild(
        editBtn
      );


      actions.appendChild(
        deleteBtn
      );


      item.appendChild(
        title
      );


      item.appendChild(
        meta
      );


      item.appendChild(
        actions
      );


      postsList.appendChild(
        item
      );

    });
  }


  /*
   * HTML 문자 안전 처리
   */

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        '&',
        '&amp;'
      )

      .replaceAll(
        '<',
        '&lt;'
      )

      .replaceAll(
        '>',
        '&gt;'
      )

      .replaceAll(
        '"',
        '&quot;'
      )

      .replaceAll(
        "'",
        '&#039;'
      );
  }


  /*
   * 게시글 저장 및 수정
   */

  async function savePost() {

    clearStatus();


    const id =
      document
        .getElementById(
          'postId'
        )
        .value;


    const title =
      document
        .getElementById(
          'title'
        )
        .value
        .trim();


    const content =
      document
        .getElementById(
          'content'
        )
        .value
        .trim();


    const author =
      document
        .getElementById(
          'author'
        )
        .value
        .trim()

      ||
      'ACTS MISSION ALLIANCE';


    const isPublished =
      document
        .getElementById(
          'published'
        )
        .value
      === 'true';


    if (!title) {

      showStatus(
        '제목을 입력해주세요.',
        'error'
      );

      return;
    }


    if (!content) {

      showStatus(
        '본문을 입력해주세요.',
        'error'
      );

      return;
    }


    document
      .getElementById(
        'saveBtn'
      )
      .disabled =
        true;


    let result;


    /*
     * 기존 게시글 수정
     */

    if (id) {

      result =
        await supabaseClient

          .from('posts')

          .update({

            category:
              currentCategory,

            title:
              title,

            content:
              content,

            author:
              author,

            is_published:
              isPublished,

            updated_at:
              new Date()
                .toISOString()

          })

          .eq(
            'id',
            id
          );

    }


    /*
     * 새 게시글 등록
     */

    else {

      result =
        await supabaseClient

          .from('posts')

          .insert({

            category:
              currentCategory,

            title:
              title,

            content:
              content,

            author:
              author,

            is_published:
              isPublished,

            updated_at:
              new Date()
                .toISOString()

          });

    }


    document
      .getElementById(
        'saveBtn'
      )
      .disabled =
        false;


    if (result.error) {

      console.error(
        result.error
      );


      showStatus(

        '저장하지 못했습니다: '
        +
        result.error.message,

        'error'

      );


      return;
    }


    showStatus(

      id

        ? '게시글이 수정되었습니다.'

        : '게시글이 등록되었습니다.',

      'success'

    );


    resetEditor();


    await loadPosts();
  }


  /*
   * 게시글 수정
   */

  function editPost(post) {

    document
      .getElementById(
        'postId'
      )
      .value =
        post.id;


    document
      .getElementById(
        'title'
      )
      .value =
        post.title || '';


    document
      .getElementById(
        'content'
      )
      .value =
        post.content || '';


    document
      .getElementById(
        'author'
      )
      .value =
        post.author ||
        'ACTS MISSION ALLIANCE';


    document
      .getElementById(
        'published'
      )
      .value =
        post.is_published
          ? 'true'
          : 'false';


    document
      .getElementById(
        'editorTitle'
      )
      .textContent =
        '게시글 수정';


    document
      .getElementById(
        'saveBtn'
      )
      .textContent =
        '수정 내용 저장';


    document
      .getElementById(
        'cancelEditBtn'
      )
      .style.display =
        'inline-block';


    window.scrollTo({

      top: 0,

      behavior:
        'smooth'

    });
  }


  /*
   * 게시글 삭제
   */

  async function deletePost(id) {

    const confirmed =
      confirm(
        '이 게시글을 정말 삭제하시겠습니까?'
      );


    if (!confirmed) {

      return;
    }


    const {
      error
    } =
      await supabaseClient

        .from('posts')

        .delete()

        .eq(
          'id',
          id
        );


    if (error) {

      console.error(
        error
      );


      alert(

        '게시글을 삭제하지 못했습니다.\n'
        +
        error.message

      );


      return;
    }


    resetEditor();


    await loadPosts();
  }


  /*
   * 로그아웃
   */

  async function logout() {

    await supabaseClient
      .auth
      .signOut();


    window.location.replace(
      'admin.html'
    );
  }


  /*
   * 페이지 시작
   */

  document.addEventListener(
    'DOMContentLoaded',
    async () => {

      const loggedIn =
        await checkAdminLogin();


      if (!loggedIn) {

        return;
      }


      updateBoardUI();


      await loadPosts();


      /*
       * 게시글 저장
       */

      document
        .getElementById(
          'saveBtn'
        )
        .addEventListener(
          'click',
          savePost
        );


      /*
       * 수정 취소
       */

      document
        .getElementById(
          'cancelEditBtn'
        )
        .addEventListener(
          'click',
          resetEditor
        );


      /*
       * 로그아웃
       */

      document
        .getElementById(
          'logoutBtn'
        )
        .addEventListener(
          'click',
          logout
        );


      /*
       * 관리자 대시보드로 이동
       */

      document
        .getElementById(
          'dashboardBtn'
        )
        .addEventListener(
          'click',
          () => {

            window.location.href =
              'admin-dashboard.html';

          }
        );


      /*
       * 게시판 선택
       */

      document
        .querySelectorAll(
          '.category-btn'
        )
        .forEach(
          button => {

            button.addEventListener(
              'click',
              async () => {

                currentCategory =
                  button.dataset.category;


                updateBoardUI();


                resetEditor();


                await loadPosts();

              }
            );

          }
        );

    }
  );
</script>

</body>
</html>
