<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTS 관리자 로그인</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at top right, #12385c 0%, transparent 40%),
        linear-gradient(135deg, #061a33, #0b2b50);
      color: white;
    }

    .card {
      width: min(92%, 460px);
      padding: 42px 34px;
      border: 1px solid rgba(214,174,85,.45);
      border-radius: 22px;
      background: rgba(5, 21, 40, .94);
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .brand {
      color: #d6ae55;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .description {
      color: #c8d2df;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 10px;
      border: 1px solid #51657b;
      background: #07182a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d6ae55;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #d6ae55;
      color: #061a33;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      line-height: 1.6;
      text-align: center;
      color: #f2d18b;
    }

    .links {
      margin-top: 22px;
      text-align: center;
    }

    .links a {
      color: #d6ae55;
      text-decoration: none;
      margin: 0 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="brand">ACTS MISSION ALLIANCE</div>

    <h1>관리자 로그인</h1>

    <p class="description">
      ACTS 게시판과 콘텐츠를 관리하기 위한 관리자 전용 페이지입니다.
    </p>

    <label for="email">이메일</label>
    <input
      type="email"
      id="email"
      autocomplete="username"
      placeholder="관리자 이메일"
    >

    <label for="password">비밀번호</label>
    <input
      type="password"
      id="password"
      autocomplete="current-password"
      placeholder="비밀번호"
    >

    <button id="loginButton">
      관리자 로그인
    </button>

    <div id="message"></div>

    <div class="links">
      <a href="/reset-password.html">비밀번호 재설정</a>
      <a href="/">ACTS 홈페이지</a>
    </div>
  </main>

<script>

const SUPABASE_URL = "https://ojxarsfaewehwjidwgac.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

loginButton.addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    message.textContent = "이메일과 비밀번호를 모두 입력해 주세요.";
    return;
  }

  loginButton.disabled = true;
  message.textContent = "로그인하고 있습니다...";

  const { data, error } = await client.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = "로그인에 실패했습니다. 이메일 또는 비밀번호를 확인해 주세요.";
    loginButton.disabled = false;
    return;
  }

  if (!data.user) {
    message.textContent = "사용자 정보를 확인하지 못했습니다.";
    loginButton.disabled = false;
    return;
  }

  message.textContent = "로그인 성공! 관리자 화면으로 이동합니다.";

  setTimeout(() => {
    window.location.href = "/admin-dashboard.html";
  }, 900);

});

</script>

<script src="assets/js/cross-site-network.js"></script>
</body>
</html>
