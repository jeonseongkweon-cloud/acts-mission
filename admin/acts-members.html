<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>ACTS 회원·동역자 가입 관리</title><link rel="stylesheet" href="../styles.css?v=5.1.2"><style>
:root{--a:#0b1727;--p:#111f32;--p2:#15263c;--line:#34455d;--gold:#c7a34d;--text:#f7f9fc;--muted:#9faabc;--ok:#72d69a;--warn:#efc468;--bad:#ff9292;--info:#8fc4ff}body{background:var(--a);color:var(--text)}.aw{min-height:100vh;padding:44px 0 70px}.ac{width:min(1440px,calc(100% - 32px));margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.head h1{margin:5px 0 0;font-size:clamp(2rem,4vw,3.2rem)}.kick{color:#e0c77f;font-weight:900;letter-spacing:.1em;font-size:.78rem}.head p,.muted{color:var(--muted)}.panel{background:linear-gradient(180deg,var(--p),#0e1928);border:1px solid var(--line);border-radius:18px;padding:22px}.login{max-width:520px;margin:80px auto}.field{display:grid;gap:7px;margin:14px 0}.field input,.field select{background:#0a1421;border:1px solid var(--line);border-radius:10px;color:white;padding:12px;font:inherit}.btn{border:1px solid var(--line);background:#17273b;color:white;border-radius:10px;padding:10px 14px;font:inherit;font-weight:850;cursor:pointer}.gold{background:linear-gradient(135deg,#e2c574,#a47b25);color:#16120a}.danger{color:#ffc6c6}.status{min-height:23px;margin-top:11px;color:var(--muted)}.status.error{color:var(--bad)}.status.success{color:var(--ok)}.dash{display:none}.dash.show{display:block}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:16px}.stat{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:1.7rem;margin-top:4px}.toolbar{display:grid;grid-template-columns:1fr 170px 170px auto;gap:9px;margin-bottom:14px}.toolbar input,.toolbar select{background:#0a1421;border:1px solid var(--line);border-radius:10px;color:#fff;padding:11px}.table-card{padding:0;overflow:hidden}.scroll{overflow:auto;max-height:68vh}.dt{width:100%;border-collapse:collapse;min-width:1250px}.dt th{position:sticky;top:0;background:#17273b;padding:12px;text-align:left;font-size:.78rem}.dt td{padding:11px 12px;border-top:1px solid #263950;font-size:.87rem;vertical-align:middle}.badge2{display:inline-block;padding:5px 9px;border-radius:999px;border:1px solid;font-size:.75rem;font-weight:850}.pending{color:#f4d581}.approved{color:#94e5aa}.hold{color:#a8ceff}.rejected{color:#ffadad}.actions{display:flex;gap:6px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.modal.show{display:flex}.mc{width:min(980px,100%);max-height:92vh;overflow:auto;background:#101d2e;border:1px solid var(--line);border-radius:18px;padding:22px}.mh{display:flex;justify-content:space-between}.close{border:1px solid var(--line);background:#17273b;color:white;border-radius:50%;width:38px;height:38px}.dg{display:grid;grid-template-columns:180px 1fr 1fr;gap:12px}.photo{grid-row:span 6;min-height:240px;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#09121e}.photo img{width:100%;height:100%;object-fit:cover}.di{background:#0b1727;border:1px solid #2b3d53;border-radius:10px;padding:11px}.di small{display:block;color:var(--muted);margin-bottom:4px}.wide{grid-column:2/-1}.decision{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:17px;padding-top:17px;border-top:1px solid var(--line)}.decision label{display:grid;gap:6px}.decision input,.decision select{background:#091421;border:1px solid var(--line);border-radius:9px;color:white;padding:11px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.dg{grid-template-columns:1fr}.photo{grid-row:auto;min-height:280px}.wide{grid-column:auto}.decision{grid-template-columns:1fr}}
</style></head><body><main class="aw"><div class="ac"><section id="login" class="panel login"><p class="kick">ACTS ADMINISTRATION</p><h2>회원·동역자 가입 관리자 로그인</h2><p class="muted">승인된 ACTS 관리자 계정으로 로그인해 주세요.</p><form id="lf"><label class="field">관리자 이메일<input id="le" type="email" autocomplete="username" required></label><label class="field">비밀번호<input id="lp" type="password" autocomplete="current-password" required></label><button class="btn gold">관리자 로그인</button><p id="ls" class="status"></p></form><p class="muted">관리자 비밀번호는 이 페이지에 저장되지 않으며 Supabase Auth로 인증됩니다.</p><p><a href="../index.html" style="color:#e0c77f">← ACTS 홈페이지</a></p></section>
<section id="dash" class="dash"><div class="head"><div><p class="kick">ACTS MEMBER APPLICATIONS</p><h1>회원·동역자 가입 관리</h1><p>신청 확인, 심사상태 변경과 회원번호 발급을 관리합니다.</p></div><div><button id="refresh" class="btn">새로고침</button> <button id="logout" class="btn danger">로그아웃</button></div></div><div class="stats"><div class="stat"><small>전체</small><strong id="sa">0</strong></div><div class="stat"><small>심사중</small><strong id="sp">0</strong></div><div class="stat"><small>승인</small><strong id="sv">0</strong></div><div class="stat"><small>보류</small><strong id="sh">0</strong></div><div class="stat"><small>반려</small><strong id="sr">0</strong></div></div><div class="toolbar"><input id="q" placeholder="이름 · 연락처 · 이메일 · 교회 · 추천인 검색"><select id="sf"><option value="">모든 상태</option><option value="pending">심사중</option><option value="approved">승인</option><option value="hold">보류</option><option value="rejected">반려</option></select><select id="rf"><option value="">모든 지역</option></select><button id="csv" class="btn">CSV 내보내기</button></div><section class="panel table-card"><div class="scroll"><table class="dt"><thead><tr><th>접수일</th><th>신청자</th><th>국가·언어</th><th>지역</th><th>교회·소속</th><th>참여분야</th><th>연락처</th><th>추천인</th><th>상태</th><th>회원번호</th><th>관리</th></tr></thead><tbody id="tb"></tbody></table></div></section><p id="ds" class="status"></p></section></div></main>
<div id="modal" class="modal"><div class="mc"><div class="mh"><div><p class="kick">APPLICATION DETAIL</p><h2 id="mt">신청자 상세정보</h2></div><button id="x" class="close">×</button></div><div id="dg" class="dg"></div><div class="decision"><label>심사상태<select id="dec"><option value="pending">심사중</option><option value="approved">승인</option><option value="hold">보류</option><option value="rejected">반려</option></select></label><label>회원번호<input id="mn" placeholder="승인 시 자동 발급"></label><button id="save" class="btn gold">심사결과 저장</button></div><p id="ms" class="status"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const U='https://ojxarsfaewehwjidwgac.supabase.co',K='sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0',db=supabase.createClient(U,K),$=s=>document.querySelector(s);let rows=[],cur=null;const SL={pending:'심사중',approved:'승인',hold:'보류',rejected:'반려'};function st(e,m,c=''){e.textContent=m||'';e.className='status '+c}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function fd(v){if(!v)return'-';return new Date(v).toLocaleString('ko-KR')}function num(r){return`ACTS-${new Date(r.created_at||Date.now()).getFullYear()}-${String(r.id).padStart(5,'0')}`}function showL(){$('#login').style.display='block';$('#dash').classList.remove('show')}function showD(){$('#login').style.display='none';$('#dash').classList.add('show')}
$('#lf').onsubmit=async e=>{e.preventDefault();st($('#ls'),'로그인 확인 중...');const{error}=await db.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error)return st($('#ls'),'로그인에 실패했습니다.','error');showD();load()};$('#logout').onclick=async()=>{await db.auth.signOut();showL()};$('#refresh').onclick=load;
async function load(){st($('#ds'),'신청정보를 불러오는 중입니다...');const{data,error}=await db.from('acts_member_applications').select('*').order('created_at',{ascending:false});if(error)return st($('#ds'),'관리자 조회 권한을 확인해 주세요.','error');rows=data||[];regions();render();st($('#ds'),`총 ${rows.length}건을 불러왔습니다.`,'success')}
function regions(){let s=$('#rf'),v=s.value,a=[...new Set(rows.map(r=>r.region).filter(Boolean))].sort();s.innerHTML='<option value="">모든 지역</option>'+a.map(x=>`<option>${esc(x)}</option>`).join('');s.value=v}function filtered(){let q=$('#q').value.toLowerCase(),s=$('#sf').value,r=$('#rf').value;return rows.filter(x=>(!q||[x.name,x.phone,x.email,x.church,x.organization,x.referrer,x.member_number].join(' ').toLowerCase().includes(q))&&(!s||x.status===s)&&(!r||x.region===r))}function badge(s){return`<span class="badge2 ${esc(s)}">${SL[s]||esc(s||'미지정')}</span>`}function render(){let l=filtered();$('#sa').textContent=rows.length;$('#sp').textContent=rows.filter(x=>x.status==='pending').length;$('#sv').textContent=rows.filter(x=>x.status==='approved').length;$('#sh').textContent=rows.filter(x=>x.status==='hold').length;$('#sr').textContent=rows.filter(x=>x.status==='rejected').length;$('#tb').innerHTML=l.map(r=>`<tr><td>${esc(fd(r.created_at))}</td><td><b>${esc(r.name)}</b><br><small>${esc(r.email||'')}</small></td><td><b>${esc(r.country_name||r.country_code||'-')}</b><br><small>${esc(r.preferred_language_label||r.preferred_language||'-')}</small></td><td>${esc(r.region||'-')}</td><td>${esc(r.church||r.organization||'-')}</td><td>${esc(r.participation_type||'-')}</td><td>${esc(r.phone||'-')}</td><td>${esc(r.referrer||'-')}</td><td>${badge(r.status)}</td><td>${esc(r.member_number||'-')}</td><td><div class="actions"><button class="btn" data-d="${r.id}">상세</button><a class="btn" href="mailto:${esc(r.email||'')}?subject=${encodeURIComponent('ACTS Mission Alliance - Membership')}">메일회신</a><button class="btn gold" data-a="${r.id}">승인</button></div></td></tr>`).join('')}
['q','sf','rf'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));$('#tb').onclick=e=>{let d=e.target.closest('[data-d]'),a=e.target.closest('[data-a]');if(d)detail(Number(d.dataset.d));if(a)approve(Number(a.dataset.a))};async function photo(p){if(!p)return null;const{data,error}=await db.storage.from('acts-member-photos').createSignedUrl(p,600);return error?null:data.signedUrl}async function detail(id){cur=rows.find(x=>x.id===id);if(!cur)return;$('#modal').classList.add('show');$('#mt').textContent=cur.name+' 신청정보';$('#dec').value=cur.status||'pending';$('#mn').value=cur.member_number||'';let ph=await photo(cur.photo_url);const items=[['이름',cur.name],['나이',cur.age],['국가',cur.country_name||cur.country_code],['선호언어',cur.preferred_language_label||cur.preferred_language],['지역',cur.region],['핸드폰',cur.phone],['이메일',cur.email],['교회',cur.church],['교단',cur.denomination],['직분·직책',cur.position],['소속기관',cur.organization],['사역 분야',cur.ministry_field],['직업·전문 분야',cur.profession],['참여 희망',cur.participation_type],['관심 국가·지역',cur.country_interest],['가입경로',cur.join_source],['추천인',cur.referrer],['선교·봉사 경험',cur.mission_experience],['전문기술·재능',cur.skills],['자기소개·참여동기',cur.introduction]];$('#dg').innerHTML=`<div class="photo">${ph?`<img src="${esc(ph)}">`:'사진 없음'}</div>`+items.map((x,i)=>`<div class="di ${i>=15?'wide':''}"><small>${x[0]}</small><div>${esc(x[1]||'-')}</div></div>`).join('')}$('#x').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};$('#dec').onchange=()=>{if(cur&&$('#dec').value==='approved'&&!$('#mn').value)$('#mn').value=num(cur)};$('#save').onclick=async()=>{if(!cur)return;let status=$('#dec').value,member=$('#mn').value.trim();if(status==='approved'&&!member)member=num(cur);const{data,error}=await db.from('acts_member_applications').update({status,member_number:member||null}).eq('id',cur.id).select().single();if(error)return st($('#ms'),'저장 권한을 확인해 주세요.','error');rows[rows.findIndex(x=>x.id===cur.id)]=data;cur=data;render();st($('#ms'),'심사결과가 저장되었습니다.','success')};async function approve(id){let r=rows.find(x=>x.id===id);if(!r||!confirm(`${r.name} 신청자를 승인하시겠습니까?`))return;let member=r.member_number||num(r);const{data,error}=await db.from('acts_member_applications').update({status:'approved',member_number:member}).eq('id',id).select().single();if(error)return alert('관리자 UPDATE 권한을 확인해 주세요.');rows[rows.findIndex(x=>x.id===id)]=data;render()}$('#csv').onclick=()=>{let h=['접수일','이름','나이','국가','언어','지역','핸드폰','이메일','교회','교단','직분','소속','사역분야','전문분야','참여희망','가입경로','추천인','상태','회원번호'],v=filtered().map(r=>[fd(r.created_at),r.name,r.age,r.country_name||r.country_code,r.preferred_language_label||r.preferred_language,r.region,r.phone,r.email,r.church,r.denomination,r.position,r.organization,r.ministry_field,r.profession,r.participation_type,r.join_source,r.referrer,SL[r.status]||r.status,r.member_number]);let csv='\uFEFF'+[h,...v].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),b=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ACTS-회원가입-'+new Date().toISOString().slice(0,10)+'.csv';a.click()};db.auth.getSession().then(({data})=>data.session?(showD(),load()):showL())})();</script></body></html>
