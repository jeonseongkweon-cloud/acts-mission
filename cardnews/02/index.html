<meta property="og:type" content="website"><meta property="og:title" content="ACTS MISSION ALLIANCE | CARD NEWS 02"><meta property="og:description" content="12장의 카드뉴스로 ACTS의 새로운 비전을 만나보세요."><meta property="og:url" content="https://acts.pe.kr/cardnews/02/"><meta property="og:image" content="https://acts.pe.kr/cardnews/02/assets/01.webp">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#020b18;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}body{min-height:100vh}.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#020b18e8;backdrop-filter:blur(10px);z-index:10;border-bottom:1px solid #ffffff18}.brand{font-weight:800;letter-spacing:.08em;color:#f4ca62;font-size:14px}.count{font-variant-numeric:tabular-nums;color:#dbe8ff;font-size:14px}.stage{min-height:calc(100vh - 118px);display:grid;place-items:center;padding:12px;overflow:hidden;touch-action:pan-y}.card{display:block;width:min(100%,760px);height:auto;max-height:calc(100vh - 150px);object-fit:contain;box-shadow:0 12px 45px #000b;border-radius:8px;user-select:none;-webkit-user-drag:none}.controls{min-height:64px;position:sticky;bottom:0;display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#020b18ed;backdrop-filter:blur(10px);z-index:10;border-top:1px solid #ffffff18;flex-wrap:wrap}button,a.btn{border:1px solid #ffffff2b;background:#0b1e38;color:#fff;border-radius:999px;padding:10px 14px;font-weight:700;text-decoration:none;font-size:13px}button.primary{background:linear-gradient(135deg,#9b7119,#e6bc4d);color:#07101d;border:0}.dots{display:flex;gap:5px;justify-content:center;margin:8px}.dot{width:6px;height:6px;border-radius:50%;background:#ffffff35}.dot.on{background:#f4ca62;transform:scale(1.35)}.all{display:none;max-width:760px;margin:auto;padding:10px}.all img{display:block;width:100%;margin:0 0 14px;border-radius:8px}.hint{text-align:center;color:#aebbd0;font-size:12px;padding:4px}.end{display:none;text-align:center;padding:30px 15px 60px}.end h2{color:#f4ca62}.end a{display:inline-block;margin:5px}.intro{color:#f4ca62;text-align:center;font-weight:800;font-size:20px;line-height:1.65;letter-spacing:-.02em}.intro small{display:block;color:#aebbd0;font-weight:500;font-size:13px;letter-spacing:0}.error{max-width:500px;text-align:center;line-height:1.7;color:#ffd0d0}@media(max-width:600px){.top{height:48px}.stage{padding:4px;min-height:calc(100vh - 108px)}.card{width:100%;max-height:calc(100vh - 125px);border-radius:3px}.controls{min-height:60px}button,a.btn{padding:9px 11px}.brand{font-size:12px}.intro{font-size:18px}}

</head><body>
<header class="top"><div class="brand">ACTS MISSION ALLIANCE</div><div class="count" id="count">1 / 12</div></header>
<main id="single"><div class="stage" id="stage"><div class="intro">여러 단체가 하나로 움직이는 이유<small>12장의 카드로 ACTS의 비전과 사역을 만나보세요.</small></div><img id="card" class="card" alt="ACTS 카드뉴스 02" hidden></div><div class="hint">화면을 좌우로 밀거나 버튼을 눌러 넘겨보세요</div><div class="dots" id="dots"></div></main>
<section class="all" id="all"></section><section class="end" id="end"><h2>함께 만드는 더 밝은 세상</h2><p>ACTS MISSION ALLIANCE</p><a class="btn" href="https://acts.pe.kr/">ACTS 홈페이지</a><button onclick="go(0)">처음부터 보기</button></section>
<nav class="controls"><button id="prev">‹ 이전</button><button class="primary" id="auto">▶ 자동보기</button><button id="view">☰ 전체보기</button><button id="share">↗ 공유</button><button id="next">다음 ›</button></nav>
<script>
const total=12,ext='webp';let i=0,timer=null,allMode=false;const card=document.getElementById('card'),count=document.getElementById('count'),dots=document.getElementById('dots'),stage=document.getElementById('stage'),all=document.getElementById('all'),single=document.getElementById('single'),end=document.getElementById('end');const src=n=>`assets/${String(n+1).padStart(2,'0')}.${ext}`;for(let n=0;n<total;n++){let d=document.createElement('span');d.className='dot';dots.appendChild(d)}function render(){card.hidden=false;card.src=src(i);card.alt=`ACTS 카드뉴스 02 ${i+1} / ${total}`;count.textContent=`${i+1} / ${total}`;[...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i));end.style.display='none';history.replaceState(null,'',`#${i+1}`)}function go(n){allMode=false;all.style.display='none';single.style.display='block';end.style.display='none';i=Math.max(0,Math.min(total-1,n));render();scrollTo({top:0,behavior:'smooth'})}function next(){if(i<total-1)go(i+1);else{stop();single.style.display='none';end.style.display='block'}}function prev(){if(i>0)go(i-1)}function stop(){clearInterval(timer);timer=null;document.getElementById('auto').textContent='▶ 자동보기'}function toggleAuto(){if(timer){stop();return}document.getElementById('auto').textContent='Ⅱ 정지';timer=setInterval(next,7000)}function toggleAll(){stop();allMode=!allMode;if(allMode){single.style.display='none';end.style.display='none';all.innerHTML='';for(let n=0;n<total;n++){let im=new Image();im.src=src(n);im.alt=`ACTS 카드뉴스 02 ${n+1}`;im.loading='lazy';all.appendChild(im)}all.style.display='block';document.getElementById('view').textContent='▣ 한장보기'}else{all.style.display='none';single.style.display='block';document.getElementById('view').textContent='☰ 전체보기';render()}scrollTo({top:0,behavior:'smooth'})}async function share(){const data={title:'ACTS MISSION ALLIANCE | CARD NEWS 02',text:'ACTS의 새로운 이야기를 12장의 카드뉴스로 만나보세요.',url:location.href.split('#')[0]};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{try{await navigator.clipboard.writeText(data.url);alert('카드뉴스 주소를 복사했습니다.')}catch(e){prompt('아래 주소를 복사해주세요.',data.url)}}}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('auto').onclick=toggleAuto;document.getElementById('view').onclick=toggleAll;document.getElementById('share').onclick=share;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});let sx=0,sy=0;stage.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev()}},{passive:true});card.onerror=()=>{stage.innerHTML='<div class="error"><b>카드 이미지 준비 중</b><br>01.webp ~ 12.webp를 cardnews/02/assets/ 폴더에 올리면 자동으로 표시됩니다.</div>'};let h=parseInt(location.hash.slice(1));if(h>=1&&h<=total)i=h-1;render();
</script></body></html>
