<!doctype html><html lang="ko"><head><title>새 비밀번호 설정 | ACTS</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css?v=5.1.2"><style>:root{--bg:#071426;--panel:#0d1d33;--line:rgba(255,255,255,.12);--gold:#d7b35a;--text:#eef4ff;--muted:#aebbd1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061221,#0a1930);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.page{min-height:100vh;padding:32px 16px 72px}.wrap{width:min(720px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.brand{color:#fff;text-decoration:none}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}.link,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:11px;text-decoration:none;font-weight:800}.link{color:#fff;border:1px solid var(--line)}.hero,.card{background:rgba(13,29,51,.94);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 48px rgba(0,0,0,.2)}.hero{padding:28px;margin-bottom:18px}.hero .eyebrow{color:var(--gold);font-weight:900}.hero h1{margin:7px 0 8px}.hero p,.note{color:var(--muted);line-height:1.7}.card{padding:24px}.field{display:grid;gap:7px;margin-top:14px}.field label{font-weight:800}.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#08162a;color:#fff;font:inherit}.btn{margin-top:18px;border:0;cursor:pointer;background:linear-gradient(135deg,#d7b35a,#987328);color:#fff}.status{margin-top:14px;min-height:22px;font-weight:800}.ok{color:#68dc9a}.err{color:#ff8b8b}</style></head><body><main class="page"><div class="wrap"><div class="top"><a class="brand" href="../"><b>GLOBAL MEMBER CENTER</b><small>ACTS 통합회원센터</small></a><a class="link" href="login.html">로그인</a></div><section class="hero"><div class="eyebrow">RESET PASSWORD</div><h1>새 비밀번호 설정</h1><p>이메일로 받은 보안 링크를 통해 들어온 경우 새 비밀번호를 설정할 수 있습니다.</p></section><section class="card"><form id="pwForm"><div class="field"><label for="pw1">새 비밀번호</label><input id="pw1" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label for="pw2">새 비밀번호 확인</label><input id="pw2" type="password" minlength="8" required autocomplete="new-password"></div><button id="saveBtn" class="btn" type="submit">새 비밀번호 저장</button><div id="status" class="status"></div></form><p class="note">보안을 위해 8자 이상의 충분히 긴 비밀번호를 사용해 주세요.</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0');const form=document.getElementById('pwForm'),st=document.getElementById('status'),btn=document.getElementById('saveBtn');let recoveryReady=false;db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session){recoveryReady=true;st.textContent='새 비밀번호를 입력해 주세요.';st.className='status';}});setTimeout(async()=>{const {data}=await db.auth.getSession();if(data.session) recoveryReady=true;if(!recoveryReady){st.textContent='유효한 재설정 링크가 필요합니다. 이메일에서 받은 링크로 다시 접속해 주세요.';st.className='status err';}},1200);form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('pw1').value,b=document.getElementById('pw2').value;if(a!==b){st.textContent='비밀번호 확인이 일치하지 않습니다.';st.className='status err';return;}if(!recoveryReady){st.textContent='재설정 세션을 확인할 수 없습니다.';st.className='status err';return;}btn.disabled=true;const {error}=await db.auth.updateUser({password:a});if(error){st.textContent='저장하지 못했습니다: '+error.message;st.className='status err';btn.disabled=false;return;}st.textContent='비밀번호가 변경되었습니다. 잠시 후 로그인 화면으로 이동합니다.';st.className='status ok';setTimeout(()=>location.href='login.html',1400);});</script></body></html>
