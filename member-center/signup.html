<!doctype html><html lang="ko"><head><title>통합회원 가입 | ACTS</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../styles.css?v=5.1.2">
<style>
:root{--mc-bg:#071426;--mc-panel:#0d1d33;--mc-line:rgba(255,255,255,.12);--mc-gold:#d7b35a;--mc-text:#eef4ff;--mc-muted:#aebbd1}
*{box-sizing:border-box}.mc-page{min-height:100vh;background:linear-gradient(180deg,#061221,#0a1930);color:var(--mc-text);padding:32px 16px 72px}
.mc-wrap{width:min(980px,100%);margin:auto}.mc-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.mc-brand{display:flex;align-items:center;gap:12px}.mc-brand img{width:48px;height:48px;object-fit:contain}.mc-brand b{display:block;font-size:18px}.mc-brand small{color:var(--mc-muted)}
.mc-link{color:var(--mc-text);border:1px solid var(--mc-line);padding:9px 13px;border-radius:11px;text-decoration:none}
.mc-hero,.mc-card{background:rgba(13,29,51,.94);border:1px solid var(--mc-line);border-radius:20px;box-shadow:0 20px 48px rgba(0,0,0,.2)}
.mc-hero{padding:28px;margin-bottom:18px}.mc-hero .eyebrow{color:var(--mc-gold);font-weight:900;letter-spacing:.08em}.mc-hero h1{margin:6px 0 8px}.mc-hero p{margin:0;color:var(--mc-muted)}
.mc-card{padding:24px;margin:16px 0}.mc-card h2{margin:0 0 16px;color:var(--mc-gold);font-size:20px}.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mc-field{display:grid;gap:7px}.mc-field.full{grid-column:1/-1}.mc-field label{font-weight:800}.mc-field input,.mc-field select{width:100%;padding:12px 13px;border:1px solid var(--mc-line);border-radius:10px;background:#08162a;color:#fff;font:inherit}
.mc-btn{border:0;border-radius:11px;padding:13px 19px;background:linear-gradient(135deg,#d7b35a,#987328);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.mc-btn.secondary{background:#172942;border:1px solid var(--mc-line)}.mc-btn:disabled{opacity:.55}
.mc-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mc-status{font-weight:800;min-height:22px}.mc-ok{color:#68dc9a}.mc-err{color:#ff8b8b}.mc-work{color:#f0cc74}
.mc-orgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mc-org{padding:16px;border:1px solid var(--mc-line);border-radius:14px;background:#0a1830}.mc-org b{display:block;margin-bottom:5px}.mc-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(215,179,90,.14);color:#e3c477;font-size:12px;font-weight:900}
.mc-photo{width:104px;height:128px;border-radius:12px;object-fit:cover;border:1px solid var(--mc-line);background:#08162a}
.mc-note{font-size:13px;color:var(--mc-muted);line-height:1.6}.mc-divider{height:1px;background:var(--mc-line);margin:18px 0}
@media(max-width:720px){.mc-grid,.mc-orgs{grid-template-columns:1fr}.mc-field.full{grid-column:auto}.mc-top{align-items:flex-start}.mc-brand small{display:block}}
</style>
</head><body>
<div class="mc-page"><div class="mc-wrap">
<div class="mc-top">
<a class="mc-brand" href="../"><img src="../assets/official/official-logo.webp" alt="ACTS"><span><b>GLOBAL MEMBER CENTER</b><small>ACTS · IDP · WTKF · IPMA 통합회원센터</small></span></a>
<a class="mc-link" href="../">ACTS 홈</a>
</div>
<section class="mc-hero"><div class="eyebrow">SIGN UP · 사인 업</div><h1>통합회원 가입</h1>
<p>계정은 한 번만 만들고 ACTS, 국제드론순찰대, 태권검도, 국제경찰무도연합회에 연결해서 사용할 수 있습니다.</p></section>
<form id="signupForm" class="mc-card">
<h2>공통 로그인 계정 만들기</h2><div class="mc-grid">
<div class="mc-field"><label>이름</label><input name="name" required maxlength="40"></div>
<div class="mc-field"><label>이메일</label><input name="email" type="email" required maxlength="120"></div>
<div class="mc-field"><label>비밀번호</label><input name="password" type="password" required minlength="6"></div>
<div class="mc-field"><label>비밀번호 확인</label><input name="password2" type="password" required minlength="6"></div>
</div><div class="mc-divider"></div>
<div class="mc-row"><button class="mc-btn" id="signupBtn" type="submit">통합계정 만들기</button>
<a class="mc-link" href="login.html">이미 계정이 있습니다</a><span id="status" class="mc-status"></span></div>
<p class="mc-note">이메일 인증 후 로그인하면 기본정보와 프로필 사진을 한 번만 등록할 수 있습니다.</p>
</form>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>const SUPABASE_URL='https://ojxarsfaewehwjidwgac.supabase.co',SUPABASE_KEY='sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('signupForm'),btn=document.getElementById('signupBtn'),st=document.getElementById('status');
const set=(m,c='')=>{st.textContent=m;st.className='mc-status '+c};
form.addEventListener('submit',async e=>{
 e.preventDefault();const f=new FormData(form),p=f.get('password'),p2=f.get('password2');
 if(p!==p2)return set('비밀번호가 서로 다릅니다.','mc-err');
 btn.disabled=true;set('계정을 만들고 있습니다...','mc-work');
 const {data,error}=await db.auth.signUp({
   email:String(f.get('email')).trim(),
   password:String(p),
   options:{data:{name:String(f.get('name')).trim(),gms_portal_signup:true,source_org:'GLOBAL'},emailRedirectTo:'https://acts.pe.kr/member-center/login.html'}
 });
 if(error)set(error.message,'mc-err');
 else {form.reset();set('가입되었습니다. 이메일의 인증 링크를 누른 뒤 로그인해 주세요.','mc-ok')}
 btn.disabled=false;
});
</script>
<script src="../assets/js/cross-site-network.js"></script>
</body></html>
