<!doctype html><html lang="ko"><head><title>통합회원 마이페이지 | ACTS</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../styles.css?v=5.1.2">
<style>
:root{--mc-bg:#071426;--mc-panel:#0d1d33;--mc-line:rgba(255,255,255,.12);--mc-gold:#d7b35a;--mc-text:#eef4ff;--mc-muted:#aebbd1}
*{box-sizing:border-box}.mc-page{min-height:100vh;background:linear-gradient(180deg,#061221,#0a1930);color:var(--mc-text);padding:32px 16px 72px}
.mc-wrap{width:min(980px,100%);margin:auto}.mc-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.mc-brand{display:flex;align-items:center;gap:12px}.mc-brand img{width:48px;height:48px;object-fit:contain}.mc-brand b{display:block;font-size:18px}.mc-brand small{color:var(--mc-muted)}
.mc-link{color:var(--mc-text);border:1px solid var(--mc-line);padding:9px 13px;border-radius:11px;text-decoration:none}
.mc-hero,.mc-card{background:rgba(13,29,51,.94);border:1px solid var(--mc-line);border-radius:20px;box-shadow:0 20px 48px rgba(0,0,0,.2)}
.mc-hero{padding:28px;margin-bottom:18px}.mc-hero .eyebrow{color:var(--mc-gold);font-weight:900;letter-spacing:.08em}.mc-hero h1{margin:6px 0 8px}.mc-hero p{margin:0;color:var(--mc-muted)}
.mc-card{padding:24px;margin:16px 0}.mc-card h2{margin:0 0 16px;color:var(--mc-gold);font-size:20px}.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mc-field{display:grid;gap:7px}.mc-field.full{grid-column:1/-1}.mc-field label{font-weight:800}.mc-field input,.mc-field select{width:100%;padding:12px 13px;border:1px solid var(--mc-line);border-radius:10px;background:#08162a;color:#fff;font:inherit}
.mc-btn{border:0;border-radius:11px;padding:13px 19px;background:linear-gradient(135deg,#d7b35a,#987328);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.mc-btn.secondary{background:#172942;border:1px solid var(--mc-line)}.mc-btn:disabled{opacity:.55}
.mc-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mc-status{font-weight:800;min-height:22px}.mc-ok{color:#68dc9a}.mc-err{color:#ff8b8b}.mc-work{color:#f0cc74}
.mc-orgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mc-org{padding:16px;border:1px solid var(--mc-line);border-radius:14px;background:#0a1830}.mc-org b{display:block;margin-bottom:5px}.mc-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(215,179,90,.14);color:#e3c477;font-size:12px;font-weight:900}
.mc-photo{width:104px;height:128px;border-radius:12px;object-fit:cover;border:1px solid var(--mc-line);background:#08162a}
.mc-note{font-size:13px;color:var(--mc-muted);line-height:1.6}
.mc-detail-btn{margin-top:10px;width:100%}
.mc-modal{position:fixed;inset:0;background:rgba(2,8,20,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.mc-modal.open{display:flex}.mc-modal-box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0d1d33;border:1px solid var(--mc-line);border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.mc-modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.mc-modal-head h3{margin:0;color:var(--mc-gold)}
.mc-close{border:1px solid var(--mc-line);background:#172942;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
.mc-field textarea{width:100%;min-height:96px;padding:12px 13px;border:1px solid var(--mc-line);border-radius:10px;background:#08162a;color:#fff;font:inherit;resize:vertical}
.mc-divider{height:1px;background:var(--mc-line);margin:18px 0}
@media(max-width:720px){.mc-grid,.mc-orgs{grid-template-columns:1fr}.mc-field.full{grid-column:auto}.mc-top{align-items:flex-start}.mc-brand small{display:block}}
</style>
<link rel="stylesheet" href="assets/acts-global-language.css?v=6.0"></head><body>
<div class="mc-page"><div class="mc-wrap">
<div class="mc-top">
<a class="mc-brand" href="../"><img src="../assets/official/official-logo.webp" alt="ACTS"><span><b>GLOBAL MEMBER CENTER</b><small>ACTS · IDP · WTKF · IPMA 통합회원센터</small></span></a>
<a class="mc-link" href="../">ACTS 홈</a>
</div>
<section class="mc-hero"><div class="eyebrow">MY PAGE · 마이 페이지</div><h1>나의 통합회원 정보</h1>
<p>기본정보와 사진은 한 번만 관리하고, 원하는 단체를 추가로 연결할 수 있습니다.</p></section>
<div id="loading" class="mc-card">회원정보를 불러오고 있습니다...</div>
<div id="content" hidden>
<section class="mc-card"><div class="mc-row" style="justify-content:space-between"><h2>공통 프로필</h2><button id="logout" class="mc-btn secondary">로그아웃</button></div>
<form id="profileForm"><div class="mc-grid">
<div class="mc-field"><label>이름</label><input name="name" required></div>
<div class="mc-field"><label>이메일</label><input name="email" readonly></div>
<div class="mc-field"><label>나이</label><input name="age" type="number" min="1" max="120"></div>
<div class="mc-field"><label>지역</label><input name="region" maxlength="80"></div>
<div class="mc-field full"><label>핸드폰번호</label><input name="phone" maxlength="30"></div>
<div class="mc-field full"><label>프로필 사진</label><div class="mc-row"><img id="photoPreview" class="mc-photo" alt="프로필 사진"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="mc-note">최대 5MB. 새 사진을 선택하면 공통 사진으로 등록됩니다.</div></div>
</div><div class="mc-divider"></div><div class="mc-row"><button id="saveProfile" class="mc-btn">프로필 저장</button><span id="profileStatus" class="mc-status"></span></div></form></section>

<section class="mc-card"><h2>나의 단체 가입현황</h2><div id="orgList" class="mc-orgs"></div><p class="mc-note">여기서 단체를 추가하면 기본정보와 사진을 다시 입력하지 않습니다. 단체별 자격·경력 같은 추가정보는 다음 단계에서 별도 입력창으로 연결합니다.</p></section>
</div>

<div id="detailModal" class="mc-modal" aria-hidden="true">
  <div class="mc-modal-box">
    <div class="mc-modal-head">
      <h3 id="detailTitle">단체 추가정보</h3>
      <button type="button" id="detailClose" class="mc-close">닫기</button>
    </div>
    <form id="detailForm">
      <div id="detailFields" class="mc-grid"></div>
      <div class="mc-divider"></div>
      <div class="mc-row">
        <button type="submit" id="detailSave" class="mc-btn">추가정보 저장</button>
        <span id="detailStatus" class="mc-status"></span>
      </div>
    </form>
  </div>
</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>const SUPABASE_URL='https://ojxarsfaewehwjidwgac.supabase.co',SUPABASE_KEY='sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const orgs=[
 ['ACTS','ACTS 선교연합'],
 ['IDP','국제드론순찰대'],
 ['WTKF','세계태권검도연맹'],
 ['IPMA','국제경찰무도연합회']
];
let session,user,member;
const loading=document.getElementById('loading'),content=document.getElementById('content'),pf=document.getElementById('profileForm');
const ps=document.getElementById('profileStatus'),preview=document.getElementById('photoPreview');

async function init(){
 const r=await db.auth.getSession();session=r.data.session;
 if(!session){location.href='login.html';return} user=session.user;
 const {data,error}=await db.from('members').select('*').eq('auth_user_id',user.id).single();
 if(error){loading.textContent='회원 프로필을 불러오지 못했습니다: '+error.message;return}
 member=data;
 pf.name.value=member.name||'';pf.email.value=member.email||user.email||'';pf.age.value=member.age||'';pf.region.value=member.region||'';pf.phone.value=member.phone||'';
 await showPhoto();await loadMemberships();loading.hidden=true;content.hidden=false;
}
async function showPhoto(){
 preview.removeAttribute('src');
 if(!member.photo_url)return;
 const {data}=await db.storage.from('member-photos').createSignedUrl(member.photo_url,3600);
 if(data?.signedUrl)preview.src=data.signedUrl;
}
pf.addEventListener('submit',async e=>{
 e.preventDefault();ps.textContent='저장 중...';ps.className='mc-status mc-work';
 let photoPath=member.photo_url;
 const file=document.getElementById('photo').files[0];
 try{
  if(file){
   if(file.size>5*1024*1024)throw new Error('사진은 5MB 이하로 올려주세요.');
   const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];
   if(!ext)throw new Error('JPG, PNG, WEBP 사진만 가능합니다.');
   photoPath=`${user.id}/profile-${Date.now()}.${ext}`;
   const {error}=await db.storage.from('member-photos').upload(photoPath,file,{upsert:false,contentType:file.type});if(error)throw error;
  }
  const update={name:pf.name.value.trim(),age:pf.age.value?Number(pf.age.value):null,region:pf.region.value.trim()||null,phone:pf.phone.value.trim()||null,photo_url:photoPath};
  const {data,error}=await db.from('members').update(update).eq('auth_user_id',user.id).select().single();if(error)throw error;
  member=data;ps.textContent='프로필이 저장되었습니다.';ps.className='mc-status mc-ok';document.getElementById('photo').value='';await showPhoto();
 }catch(e){ps.textContent=e.message;ps.className='mc-status mc-err'}
});

const detailModal=document.getElementById('detailModal');
const detailForm=document.getElementById('detailForm');
const detailFields=document.getElementById('detailFields');
const detailTitle=document.getElementById('detailTitle');
const detailStatus=document.getElementById('detailStatus');
let activeMembership=null;
let activeDetail=null;

const detailSchemas={
 ACTS:[
  ['church','교회명','text'],
  ['denomination','교단','text'],
  ['ministry_field','사역분야','text'],
  ['profession','직업·전문분야','text'],
  ['participation_type','참여희망분야','text']
 ],
 IDP:[
  ['drone_license','드론 자격증 보유현황','text'],
  ['drone_license_detail','드론 자격 상세','textarea'],
  ['other_organizations','타단체 가입현황','textarea']
 ],
 WTKF:[
  ['organization','소속 도장·단체','text'],
  ['taekwondo_rank','태권도 단·품','text'],
  ['sword_experience','검도·검술 관련 경력','textarea'],
  ['wtkf_experience','태권검도 수련 여부','text']
 ],
 IPMA:[
  ['organization','소속 단체·도장','text'],
  ['primary_martial_art','주 수련무도','text'],
  ['martial_experience','무도경력','textarea'],
  ['rank_certificate','단·급·자격','text'],
  ['security_experience','경찰·경호·보안 관련 경력','textarea']
 ]
};

function esc(v=''){
 return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function statusLabel(v){
 return v==='approved'?'승인':v==='rejected'?'반려':v==='hold'?'보류':'심사중';
}
async function loadMemberships(){
 const {data,error}=await db.from('organization_memberships').select('*').eq('member_id',member.id).order('joined_at',{ascending:true});
 if(error){document.getElementById('orgList').textContent=error.message;return}
 const memberships=data||[];
 const map=Object.fromEntries(memberships.map(x=>[x.organization_code,x]));

 let details=[];
 if(memberships.length){
   const ids=memberships.map(x=>x.id);
   const r=await db.from('membership_details').select('*').in('membership_id',ids);
   if(r.error){
     console.error(r.error);
   }else{
     details=r.data||[];
   }
 }
 const detailMap=Object.fromEntries(details.map(x=>[x.membership_id,x]));
 const el=document.getElementById('orgList');el.innerHTML='';

 for(const [code,label] of orgs){
  const m=map[code],d=document.createElement('div');d.className='mc-org';
  if(m){
    const det=detailMap[m.id];
    d.innerHTML=
      `<b>${label}</b>
       <span class="mc-badge">${statusLabel(m.membership_status)}</span>
       ${m.member_number?`<div class="mc-note" style="margin-top:8px">회원번호 ${esc(m.member_number)}</div>`:''}
       <button class="mc-btn mc-detail-btn" data-detail="${m.id}" data-code="${code}">
         ${det?'정보 수정':'추가정보 입력'}
       </button>`;
  }else{
    d.innerHTML=
      `<b>${label}</b>
       <div class="mc-note">아직 연결되지 않았습니다.</div>
       <button class="mc-btn" data-code="${code}" style="margin-top:10px">가입 연결</button>`;
  }
  el.appendChild(d);
 }
 el.querySelectorAll('button[data-code]:not([data-detail])').forEach(b=>b.onclick=()=>joinOrg(b.dataset.code,b));
 el.querySelectorAll('button[data-detail]').forEach(b=>b.onclick=()=>openDetails(Number(b.dataset.detail),b.dataset.code));
}

async function joinOrg(code,btn){
 btn.disabled=true;btn.textContent='처리 중...';
 const {error}=await db.from('organization_memberships').insert({
   member_id:member.id,
   organization_code:code,
   membership_status:'pending',
   join_source:'member-center'
 });
 if(error){
   alert(error.message);btn.disabled=false;btn.textContent='가입 연결';
 }else{
   await loadMemberships();
 }
}

async function openDetails(membershipId,code){
 activeMembership={id:membershipId,organization_code:code};
 activeDetail=null;
 detailStatus.textContent='정보를 불러오고 있습니다...';
 detailStatus.className='mc-status mc-work';

 const label=(orgs.find(x=>x[0]===code)||[code,code])[1];
 detailTitle.textContent=label+' · 추가정보';
 detailFields.innerHTML='';

 const {data,error}=await db.from('membership_details').select('*').eq('membership_id',membershipId).maybeSingle();
 if(error){
   detailStatus.textContent=error.message;
   detailStatus.className='mc-status mc-err';
   return;
 }
 activeDetail=data||null;

 for(const [name,labelText,type] of detailSchemas[code]){
   const val=activeDetail?.[name]||'';
   const wrap=document.createElement('div');
   wrap.className='mc-field '+(type==='textarea'?'full':'');
   const lab=document.createElement('label');
   lab.textContent=labelText;
   const input=document.createElement(type==='textarea'?'textarea':'input');
   input.name=name;
   if(type!=='textarea') input.type='text';
   input.value=val;
   wrap.appendChild(lab);wrap.appendChild(input);
   detailFields.appendChild(wrap);
 }
 detailStatus.textContent=activeDetail?'저장된 정보를 불러왔습니다.':'필요한 추가정보를 입력해 주세요.';
 detailStatus.className='mc-status '+(activeDetail?'mc-ok':'');
 detailModal.classList.add('open');
 detailModal.setAttribute('aria-hidden','false');
 document.body.style.overflow='hidden';
}

function closeDetails(){
 detailModal.classList.remove('open');
 detailModal.setAttribute('aria-hidden','true');
 document.body.style.overflow='';
 activeMembership=null;activeDetail=null;
}
document.getElementById('detailClose').onclick=closeDetails;
detailModal.addEventListener('click',e=>{if(e.target===detailModal)closeDetails()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detailModal.classList.contains('open'))closeDetails()});

detailForm.addEventListener('submit',async e=>{
 e.preventDefault();
 if(!activeMembership)return;
 const fd=new FormData(detailForm);
 const payload={
   membership_id:activeMembership.id,
   organization_code:activeMembership.organization_code,
   updated_at:new Date().toISOString()
 };
 for(const [name] of detailSchemas[activeMembership.organization_code]){
   const v=String(fd.get(name)||'').trim();
   payload[name]=v||null;
 }
 detailStatus.textContent='저장 중...';
 detailStatus.className='mc-status mc-work';
 let error;
 if(activeDetail){
   ({error}=await db.from('membership_details').update(payload).eq('membership_id',activeMembership.id));
 }else{
   ({error}=await db.from('membership_details').insert(payload));
 }
 if(error){
   detailStatus.textContent=error.message;
   detailStatus.className='mc-status mc-err';
 }else{
   detailStatus.textContent='추가정보가 저장되었습니다.';
   detailStatus.className='mc-status mc-ok';
   activeDetail={...(activeDetail||{}),...payload};
   setTimeout(async()=>{closeDetails();await loadMemberships()},500);
 }
});

document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};
init();
</script>
<script src="assets/js/cross-site-network.js"></script>
<script src="assets/acts-global-language.js?v=6.0"></script></body></html>
