<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTS 관리자 비밀번호 변경</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at top right, #12385c 0%, transparent 40%),
        linear-gradient(135deg, #061a33, #0b2b50);
      color: white;
    }

    .card {
      width: min(92%, 460px);
      padding: 42px 34px;
      border: 1px solid rgba(214,174,85,.45);
      border-radius: 22px;
      background: rgba(5, 21, 40, .92);
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .brand {
      color: #d6ae55;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .description {
      color: #c8d2df;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 10px;
      border: 1px solid #51657b;
      background: #07182a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d6ae55;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #d6ae55;
      color: #061a33;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      line-height: 1.6;
      text-align: center;
    }

    .home {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #d6ae55;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="brand">ACTS MISSION ALLIANCE</div>

    <h1>새 비밀번호 설정</h1>

    <p class="description">
      ACTS 관리자 계정에 사용할 새 비밀번호를 입력해 주세요.
    </p>

    <label for="password">새 비밀번호</label>
    <input
      type="password"
      id="password"
      autocomplete="new-password"
      placeholder="새 비밀번호 입력"
    >

    <label for="confirmPassword">새 비밀번호 확인</label>
    <input
      type="password"
      id="confirmPassword"
      autocomplete="new-password"
      placeholder="같은 비밀번호 다시 입력"
    >

    <button id="changePassword">
      비밀번호 변경
    </button>

    <div id="message"></div>

    <a class="home" href="/">
      ACTS 홈페이지로 돌아가기
    </a>
  </main>

<script>

const SUPABASE_URL = "https://ojxarsfaewehwjidwgac.supabase.co";

const SUPABASE_KEY = "sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const button = document.getElementById("changePassword");
const message = document.getElementById("message");

async function restoreRecoverySession() {

  const params = new URLSearchParams(
    window.location.hash.substring(1)
  );

  const accessToken = params.get("access_token");
  const refreshToken = params.get("refresh_token");

  if (accessToken && refreshToken) {

    const { error } = await client.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken
    });

    if (error) {
      message.textContent =
        "비밀번호 변경 인증을 확인하지 못했습니다. 새 복구 링크를 요청해 주세요.";
    }
  }
}

restoreRecoverySession();

button.addEventListener("click", async () => {

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password.length < 8) {
    message.textContent =
      "비밀번호는 8자 이상으로 입력해 주세요.";
    return;
  }

  if (password !== confirmPassword) {
    message.textContent =
      "두 비밀번호가 서로 일치하지 않습니다.";
    return;
  }

  button.disabled = true;
  message.textContent = "비밀번호를 변경하고 있습니다...";

  const { error } = await client.auth.updateUser({
    password: password
  });

  if (error) {

    message.textContent =
      "비밀번호 변경에 실패했습니다: " +
      error.message;

    button.disabled = false;

    return;
  }

  message.textContent =
    "비밀번호가 정상적으로 변경되었습니다.";

  await client.auth.signOut();

  setTimeout(() => {
    window.location.href = "/";
  }, 2500);

});

</script>

<script src="assets/js/cross-site-network.js"></script>
</body>
</html>
